            border-top: 2px solid #fff;
            border-left: 2px solid #fff;
            border-right: 2px solid #000;
            border-bottom: 2px solid #000;
            padding: 2px;
            width: 500px;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
        }

        .title-bar {
            background-color: #000080;
            color: white;
            padding: 3px 2px 3px 3px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        
        .title-bar-text {
            display: flex;
            align-items: center;
        }
        
        .title-bar-text img {
            width: 16px;
            height: 16px;
            margin-right: 4px;
        }

        .title-bar-controls button {
            background: #c0c0c0;
            border-top: 1px solid #fff;
            border-left: 1px solid #fff;
            border-right: 1px solid #000;
            border-bottom: 1px solid #000;
            font-weight: bold;
            font-size: 10px;
            padding: 0 4px;
            cursor: pointer;
            margin-left: 2px;
        }
        
        .title-bar-controls button:active {
            border-top: 1px solid #000;
            border-left: 1px solid #000;
            border-right: 1px solid #fff;
            border-bottom: 1px solid #fff;
        }

        .window-body {
            padding: 10px;
        }

        p {
            margin-top: 0;
            margin-bottom: 10px;
        }

        fieldset {
            border-top: 1px solid #fff;
            border-left: 1px solid #fff;
            border-right: 1px solid #808080;
            border-bottom: 1px solid #808080;
            padding: 10px;
            margin-bottom: 10px;
        }
        
        legend {
            background: #c0c0c0;
            padding: 0 4px;
        }

        .field-row {
            display: flex;
            margin-bottom: 8px;
            align-items: center;
        }

        .field-row label {
            width: 120px;
        }

        input[type="text"], input[type="email"], input[type="number"], select {
            border-top: 1px solid #808080;
            border-left: 1px solid #808080;
            border-right: 1px solid #fff;
            border-bottom: 1px solid #fff;
            padding: 3px;
            background: #fff;
            font-family: 'W95FA', "MS Sans Serif", "Arial", sans-serif;
            font-size: 12px;
            box-sizing: border-box;
        }
        
        input[type="text"], input[type="email"] {
            width: 250px;
        }

        button {
            background: #c0c0c0;
            border-top: 2px solid #fff;
            border-left: 2px solid #fff;
            border-right: 2px solid #000;
            border-bottom: 2px solid #000;
            padding: 4px 10px;
            font-family: 'W95FA', "MS Sans Serif", "Arial", sans-serif;
            font-size: 12px;
            cursor: pointer;
        }

        button:active {
            border-top: 2px solid #000;
            border-left: 2px solid #000;
            border-right: 2px solid #fff;
            border-bottom: 2px solid #fff;
            padding: 5px 9px 3px 11px; /* visual shift */
        }

        .resolution-item {
            display: flex;
            margin-bottom: 4px;
        }
        
        .resolution-item input {
            flex-grow: 1;
            margin-right: 4px;
            width: auto;
        }

        .action-buttons {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
            gap: 5px;
        }

    
        /* Modal styling */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .msg-box {
            background-color: #c0c0c0;
            border-top: 2px solid #fff;
            border-left: 2px solid #fff;
            border-right: 2px solid #000;
            border-bottom: 2px solid #000;
            padding: 2px;
            width: 350px;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }
        .msg-box-content {
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .msg-icon {
            font-size: 32px;
            margin-bottom: 15px;
        }

        /* Mobile — keep Win95 look, just reflow */
        @media (max-width: 640px) {
            body {
                padding: 8px;
            }
            .window {
                position: static;
                transform: none;
                width: 100%;
                max-width: 100%;
                box-sizing: border-box;
                margin: 0 auto;
            }
            .title-bar {
                cursor: default;
            }
            .window-body {
                padding: 8px;
            }
            fieldset {
                padding: 8px;
            }
            .field-row {
                flex-wrap: wrap;
                align-items: flex-start;
            }
            .field-row label {
                width: 100%;
                margin-bottom: 4px;
            }
            input[type="text"], input[type="email"] {
                width: 100%;
            }
            .resolution-item {
                flex-wrap: wrap;
                gap: 4px;
            }
            .resolution-item input {
                width: 100%;
                min-width: 0;
                margin-right: 0;
            }
            .action-buttons {
                justify-content: stretch;
                flex-wrap: wrap;
            }
            .action-buttons button {
                flex: 1;
                min-width: 120px;
            }
            .msg-box {
                width: calc(100% - 24px);
                max-width: 350px;
            }
            .media-player {
                bottom: 8px;
                right: 8px;
                left: 8px;
                width: auto;
            }
        }

        /* ── Retro Windows 95 Media Player ── */
        .media-player {
            position: fixed;
            bottom: 14px;
            right: 14px;
            background-color: #c0c0c0;
            border-top: 2px solid #fff;
            border-left: 2px solid #fff;
            border-right: 2px solid #000;
            border-bottom: 2px solid #000;
            padding: 2px;
            width: 250px;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
            z-index: 800;
            user-select: none;
            -webkit-user-select: none;
        }
        .media-player .player-title-bar {
            background-color: #000080;
            color: white;
            padding: 2px 4px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
            touch-action: none;
        }
        .media-player .player-title-bar button {
            background: #c0c0c0;
            border-top: 1px solid #fff;
            border-left: 1px solid #fff;
            border-right: 1px solid #000;
            border-bottom: 1px solid #000;
            font-size: 9px;
            font-weight: bold;
            line-height: 9px;
            padding: 1px 4px;
            cursor: pointer;
            margin-left: 2px;
            font-family: 'W95FA', "MS Sans Serif", sans-serif;
        }
        .media-player .player-title-bar button:active {
            border-top: 1px solid #000;
            border-left: 1px solid #000;
            border-right: 1px solid #fff;
            border-bottom: 1px solid #fff;
        }
        .media-player .player-body {
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .media-player .player-display {
            background-color: #000;
            color: #00ff00;
            font-family: monospace;
            padding: 4px 6px;
            font-size: 11px;
            border-top: 1px solid #808080;
            border-left: 1px solid #808080;
            border-right: 1px solid #fff;
            border-bottom: 1px solid #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .media-player .player-status-line {
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 10px;
            color: #111;
            padding: 0 1px;
        }
        .media-player .player-controls {
            display: flex;
            gap: 2px;
            justify-content: space-between;
        }
        .media-player .player-controls button {
            flex: 1;
            padding: 3px 2px;
            font-size: 10px;
            cursor: pointer;
            text-align: center;
            font-family: 'W95FA', "MS Sans Serif", sans-serif;
        }
    </style>
</head>

    <script>
        // ── CONFIGURE THIS after `sam deploy` ──
        const API_URL = 'https://fn1b9eweih.execute-api.eu-north-1.amazonaws.com/prod';

        // Drag windows by their title bar (desktop only)
        (function initWindowDrag() {
            const isMobile = () => window.matchMedia('(max-width: 640px)').matches;

            function makeDraggable(win, bar) {
                if (!win || !bar) return;
                let dragging = false;
                let offsetX = 0, offsetY = 0;

                function begin(clientX, clientY, target) {
                    if (isMobile()) return;
                    if (target.closest('button, input, select, .title-bar-controls')) return;
                    const rect = win.getBoundingClientRect();
                    win.style.transform = 'none';
                    win.style.bottom = 'auto';
                    win.style.right = 'auto';
                    win.style.left = (rect.left + window.scrollX) + 'px';
                    win.style.top = (rect.top + window.scrollY) + 'px';
                    offsetX = clientX - rect.left;
                    offsetY = clientY - rect.top;
                    dragging = true;
                    document.body.style.userSelect = 'none';
                }

                function move(clientX, clientY) {
                    if (!dragging) return;
                    const winRect = win.getBoundingClientRect();
                    let x = clientX - offsetX;
                    let y = clientY - offsetY;
                    const minX = -winRect.width + 60;
                    const minY = 0;
                    const maxX = window.innerWidth - 60;
                    const maxY = window.innerHeight - 24;
                    if (x < minX) x = minX;
                    if (y < minY) y = minY;
                    if (x > maxX) x = maxX;
                    if (y > maxY) y = maxY;
                    win.style.left = (x + window.scrollX) + 'px';
                    win.style.top = (y + window.scrollY) + 'px';
                }

                function end() {
                    dragging = false;
                    document.body.style.userSelect = '';
                }

                bar.addEventListener('mousedown', (e) => {
                    if (e.button !== 0) return;
                    begin(e.clientX, e.clientY, e.target);
                });
                document.addEventListener('mousemove', (e) => move(e.clientX, e.clientY));
                document.addEventListener('mouseup', end);

                bar.addEventListener('touchstart', (e) => {
                    if (e.touches.length !== 1) return;
                    const t = e.touches[0];
                    begin(t.clientX, t.clientY, e.target);
                }, { passive: true });
                document.addEventListener('touchmove', (e) => {
                    if (!dragging || e.touches.length !== 1) return;
                    const t = e.touches[0];
                    move(t.clientX, t.clientY);
                    e.preventDefault();
                }, { passive: false });
                document.addEventListener('touchend', end);
                document.addEventListener('touchcancel', end);

                window.addEventListener('resize', () => {
                    if (isMobile()) {
                        win.style.left = '';
                        win.style.top = '';
                        win.style.bottom = '';
                        win.style.right = '';
                        win.style.transform = '';
                    }
                });
            }

            const mainWin = document.querySelector('.window');
            if (mainWin) makeDraggable(mainWin, mainWin.querySelector('.title-bar'));

            const playerWin = document.querySelector('.media-player');
            if (playerWin) makeDraggable(playerWin, playerWin.querySelector('.player-title-bar'));
        })();

        function showModal(title, text, isError) {
            document.getElementById('msgTitle').textContent = title;
            document.getElementById('msgText').textContent = text;
            document.getElementById('msgIcon').textContent = isError ? '❌' : '✅';
            document.getElementById('msgModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('msgModal').style.display = 'none';
        }

        function addResolution() {
            const list = document.getElementById('resolutionList');
            if (list.children.length >= 20) return alert('Maximum 20 resolutions allowed.');
            const div = document.createElement('div');
            div.className = 'resolution-item';
            div.innerHTML = `
                <input type="text" maxlength="500" required>
                <button type="button" onclick="removeResolution(this)">Remove</button>
            `;
            list.appendChild(div);
        }

        function removeResolution(btn) {
            const list = document.getElementById('resolutionList');
            if (list.children.length <= 1) return;
            btn.parentElement.remove();
        }

        document.getElementById('capsuleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            

            const inputs = document.querySelectorAll('#resolutionList input');
            const resolutions = Array.from(inputs).map(i => i.value.trim()).filter(Boolean);

            if (resolutions.length === 0) {
                showModal('Error', 'Please add at least one resolution.', true);
                return;
            }

            const checkInDays = parseInt(document.getElementById('checkInValue').value)
                * parseInt(document.getElementById('checkInUnit').value);
            const planDurationDays = parseInt(document.getElementById('durationValue').value)
                * parseInt(document.getElementById('durationUnit').value);

            if (planDurationDays < checkInDays) {
                showModal('Error', 'Plan duration must be longer than check-in frequency.', true);
                return;
            }

            const payload = {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                resolutions,
                checkInDays,
                planDurationDays,
            };

            submitBtn.disabled = true;
            submitBtn.textContent = 'Sealing...';

            try {
                const res = await fetch(`${API_URL}/capsules`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });
                const data = await res.json();

                if (res.ok) {
                    showModal('Success', `Your message has been sealed for posterity. First check-in: ${data.nextCheckIn}. Plan ends: ${data.endsAt}. Total check-ins: ${data.totalCheckIns}.`, false);
                    document.getElementById('capsuleForm').reset();
                    const list = document.getElementById('resolutionList');
                    list.innerHTML = `
                        <div class="resolution-item">
                            <input type="text" maxlength="500" required>
                            <button type="button" onclick="removeResolution(this)">Remove</button>
                        </div>
                    `;
                } else {
                    showModal('Error', data.error || 'Something went wrong.', true);
                }
            } catch (err) {
                showModal('Network Error', err.message, true);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Seal Message';
            }
        });

        // ── Background Audio Player (Win95 Media Player) ──
        const PLAYLIST = [
            {
                title: "Four Tet - Last Song",
                sources: [
                    "media/songs/FourTetLastSong.wav",
                    "songs/FourTetLastSong.wav",
                    "static/songs/FourTetLastSong.wav"
                ]
            },
            {
                title: "rukiawaa - AWΛSUKI電霊 (Full Album)",
                sources: [
                    "media/songs/rukiawaa.mp3",
                    "songs/rukiawaa.mp3",
                    "static/songs/rukiawaa.mp3",
                    encodeURI("media/songs/rukiawaa AWΛSUKI電霊 ᶠᵘˡˡ ᵃˡᵇᵘᵐ.mp3"),
                    encodeURI("songs/rukiawaa AWΛSUKI電霊 ᶠᵘˡˡ ᵃˡᵇᵘᵐ.mp3")
                ]
            },
            {
                title: "Four Tet - ⣎⡇ꉺლ",
                sources: [
                    "media/songs/four_tet_track3.mp3",
                    "songs/four_tet_track3.mp3",
                    "static/songs/four_tet_track3.mp3",
                    encodeURI("media/songs/⣎⡇ꉺლ༽இ•̛)ྀ◞ ༎ຶ ༽ৣৢ؞ৢ؞ؖ ꉺლ - ʅ͡͡͡͡͡͡͡͡͡͡͡(̸̢̛̼̞̭͋ͅ)̸͚̰͛̔̾̀̿͒͂_̴͓̞̑̌̂̆̊͋̀_̸͎̟̯̂̓̌ ҉ ͡ ͞ ͞ ͞ ҉● ࿀ ● ࿀ ●.mp3"),
                    encodeURI("songs/⣎⡇ꉺლ༽இ•̛)ྀ◞ ༎ຶ ༽ৣৢ؞ৢ؞ؖ ꉺლ - ʅ͡͡͡͡͡͡͡͡͡͡͡(̸̢̛̼̞̭͋ͅ)̸͚̰͛̔̾̀̿͒͂_̴͓̞̑̌̂̆̊͋̀_̸͎̟̯̂̓̌ ҉ ͡ ͞ ͞ ͞ ҉● ࿀ ● ࿀ ●.mp3")
                ]
            }
        ];

        let currentTrackIndex = 0;
        let currentSourceIndex = 0;
        let isPlayPending = false;
        let userWantsPlay = false;

        const bgAudio = document.getElementById("bgAudio");
        const trackDisplay = document.getElementById("trackDisplay");
        const playPauseBtn = document.getElementById("playPauseBtn");
        const stopBtn = document.getElementById("stopBtn");
        const playerStatus = document.getElementById("playerStatus");
        const playerTime = document.getElementById("playerTime");
        const muteBtn = document.getElementById("muteBtn");
        const playerMinBtn = document.getElementById("playerMinBtn");
        const playerBody = document.getElementById("playerBody");

        bgAudio.volume = 1.0;
        bgAudio.muted = false;

        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds)) return "--:--";
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return (mins < 10 ? "0" : "") + mins + ":" + (secs < 10 ? "0" : "") + secs;
        }

        function updateTrackUI() {
            const track = PLAYLIST[currentTrackIndex];
            if (track) {
                const label = `[${currentTrackIndex + 1}/${PLAYLIST.length}] ${track.title}`;
                trackDisplay.textContent = label;
                trackDisplay.title = label;
            }
        }

        function updateTimeDisplay() {
            const current = formatTime(bgAudio.currentTime);
            const total = formatTime(bgAudio.duration);
            playerTime.textContent = `${current} / ${total}`;
        }

        function loadTrack(trackIdx, srcIdx = 0, shouldPlay = false) {
            currentTrackIndex = (trackIdx + PLAYLIST.length) % PLAYLIST.length;
            currentSourceIndex = srcIdx;
            const track = PLAYLIST[currentTrackIndex];
            const src = track.sources[currentSourceIndex] || track.sources[0];

            bgAudio.src = src;
            updateTrackUI();
            updateTimeDisplay();
            playerStatus.textContent = shouldPlay ? "[Loading...]" : "[Ready]";

            if (shouldPlay) {
                playMusic();
            }
        }

        function playMusic() {
            userWantsPlay = true;
            if (isPlayPending) return;

            isPlayPending = true;
            playerStatus.textContent = "[Loading...]";

            bgAudio.play().then(() => {
                isPlayPending = false;
                playPauseBtn.innerHTML = "&#10074;&#10074; Pause";
                playerStatus.textContent = "[Playing]";
                updateTimeDisplay();
            }).catch((err) => {
                isPlayPending = false;
                console.warn("Audio play() notice:", err);
                if (err.name === "NotAllowedError") {
                    playerStatus.textContent = "[Click Play]";
                    playPauseBtn.innerHTML = "&#9654; Play";
                } else {
                    tryFallbackSource();
                }
            });
        }

        function tryFallbackSource() {
            const track = PLAYLIST[currentTrackIndex];
            if (currentSourceIndex + 1 < track.sources.length) {
                console.log("Trying fallback source for", track.title);
                loadTrack(currentTrackIndex, currentSourceIndex + 1, userWantsPlay);
            } else {
                playerStatus.textContent = "[Error]";
                playPauseBtn.innerHTML = "&#9654; Play";
            }
        }

        function pauseMusic() {
            userWantsPlay = false;
            bgAudio.pause();
            playPauseBtn.innerHTML = "&#9654; Play";
            playerStatus.textContent = "[Paused]";
        }

        function stopMusic() {
            userWantsPlay = false;
            bgAudio.pause();
            bgAudio.currentTime = 0;
            playPauseBtn.innerHTML = "&#9654; Play";
            playerStatus.textContent = "[Stopped]";
            updateTimeDisplay();
        }

        playPauseBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            if (bgAudio.paused) {
                playMusic();
            } else {
                pauseMusic();
            }
        });

        stopBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            stopMusic();
        });

        document.getElementById("nextTrackBtn").addEventListener("click", (e) => {
            e.stopPropagation();
            loadTrack(currentTrackIndex + 1, 0, true);
        });

        document.getElementById("prevTrackBtn").addEventListener("click", (e) => {
            e.stopPropagation();
            loadTrack(currentTrackIndex - 1, 0, true);
        });

        muteBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            bgAudio.muted = !bgAudio.muted;
            muteBtn.textContent = bgAudio.muted ? "🔇" : "🔊";
        });

        bgAudio.addEventListener("timeupdate", updateTimeDisplay);
        bgAudio.addEventListener("loadedmetadata", updateTimeDisplay);
        bgAudio.addEventListener("playing", () => {
            playPauseBtn.innerHTML = "&#10074;&#10074; Pause";
            playerStatus.textContent = "[Playing]";
        });
        bgAudio.addEventListener("pause", () => {
            if (!isPlayPending) {
                playPauseBtn.innerHTML = "&#9654; Play";
                if (playerStatus.textContent === "[Playing]") {
                    playerStatus.textContent = "[Paused]";
                }
            }
        });

        bgAudio.addEventListener("error", (e) => {
            console.warn("bgAudio error:", bgAudio.error, "on src:", bgAudio.src);
            tryFallbackSource();
        });

        bgAudio.addEventListener("ended", () => {
            loadTrack(currentTrackIndex + 1, 0, true);
        });

        // Minimize / Restore shade toggle
        if (playerMinBtn && playerBody) {
            playerMinBtn.addEventListener("click", (e) => {
                e.stopPropagation();
                const isHidden = playerBody.style.display === "none";
                playerBody.style.display = isHidden ? "flex" : "none";
                playerMinBtn.textContent = isHidden ? "_" : "□";
            });
        }

        // Browser Autoplay Policy: Automatically start audio on first user gesture outside the player
        function handleFirstInteraction(e) {
            if (e && e.target && e.target.closest('#mediaPlayer')) {
                return;
            }
            if (bgAudio.paused && !userWantsPlay) {
                playMusic();
            }
            window.removeEventListener("click", handleFirstInteraction);
            window.removeEventListener("keydown", handleFirstInteraction);
            window.removeEventListener("touchstart", handleFirstInteraction);
        }
        window.addEventListener("click", handleFirstInteraction);
        window.addEventListener("keydown", handleFirstInteraction);
        window.addEventListener("touchstart", handleFirstInteraction);

        // Initialize first track
        loadTrack(0, 0, false);
    </script>
</body>
</html>
